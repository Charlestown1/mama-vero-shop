<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Mama Vero Shop</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div id="navbar-mount"></div>

<section class="dash-hero">
  <div class="container">
    <h1 id="welcome-msg">Welcome back!</h1>
    <p class="section-subtitle" style="margin-bottom:0;">Here's a quick look at your account.</p>
    <div class="dash-stats">
      <div class="dash-stat-card"><div class="num" id="stat-cart">0</div><div class="label">Items in Cart</div></div>
      <div class="dash-stat-card"><div class="num" id="stat-pending">0</div><div class="label">Pending Orders</div></div>
      <div class="dash-stat-card"><div class="num" id="stat-completed">0</div><div class="label">Completed Orders</div></div>
      <div class="dash-stat-card"><div class="num" id="stat-products">--</div><div class="label">Products Available</div></div>
    </div>
  </div>
</section>

<section class="section container">
  <div class="flex-between mb-2">
    <h2 class="section-title" style="margin-bottom:0;">Available Products</h2>
    <a href="index.html#shop" class="btn btn-outline btn-sm">View All</a>
  </div>
  <div id="product-grid" class="grid"></div>
</section>

<div id="footer-mount"></div>

<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
