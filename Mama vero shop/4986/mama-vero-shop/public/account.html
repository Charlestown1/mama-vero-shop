<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Mama Vero Shop</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div id="navbar-mount"></div>

<section class="section container" style="max-width:640px;">
  <h1 class="section-title">My Account</h1>

  <div class="card" style="padding:24px;">
    <form id="account-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" class="form-control" name="name" id="name-input">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" id="email-input" disabled>
        <div class="form-hint">Email cannot be changed.</div>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" class="form-control" name="phone" id="phone-input">
      </div>
      <button type="submit" class="btn btn-primary" id="save-btn">Save Changes</button>
    </form>
  </div>

  <div class="card mt-3" style="padding:24px;">
    <h3 class="mb-2">Recent Orders</h3>
    <div id="recent-orders"></div>
    <a href="orders.html" class="btn btn-outline btn-sm mt-2">View All Orders</a>
  </div>

  <button class="btn btn-outline btn-block mt-3" id="logout-btn">Logout</button>
</section>

<div id="footer-mount"></div>
<script src="js/app.js"></script>
<script src="js/account.js"></script>
</body>
</html>
