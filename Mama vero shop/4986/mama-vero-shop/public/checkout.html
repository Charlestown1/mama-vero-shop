<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Mama Vero Shop</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/checkout.css">
</head>
<body>
<div id="navbar-mount"></div>

<section class="section container">
  <h1 class="section-title">Checkout</h1>

  <div id="checkout-body" class="checkout-grid">
    <div>
      <div class="card" style="padding: 22px;">
        <h3 class="mb-2">Order Summary</h3>
        <div id="order-summary"></div>
      </div>

      <div id="payment-section" class="card mt-3" style="padding: 22px; display:none;">
        <h3 class="mb-2">Payment Instructions</h3>
        <p class="section-subtitle" style="margin-bottom:6px;">Transfer the total amount to the account below, then upload your proof of payment.</p>
        <div class="bank-box" id="bank-box"></div>

        <div class="form-group">
          <label>Upload Payment Proof</label>
          <div class="upload-box" id="upload-box">
            <input type="file" id="proof-input" accept="image/jpeg,image/png,image/webp" style="display:none;">
            <div id="upload-placeholder">📎 Click to select a screenshot (JPG, PNG, or WebP, max 5MB)</div>
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="upload-btn" disabled>Upload Payment Proof</button>
      </div>
    </div>

    <div>
      <div class="card" style="padding: 22px;">
        <h3 class="mb-2">Place Your Order</h3>
        <p class="section-subtitle" style="margin-bottom: 14px;">Reviewing your cart before submitting. Stock is verified again on our end.</p>
        <button class="btn btn-primary btn-block" id="place-order-btn">Place Order</button>
      </div>
    </div>
  </div>
</section>

<div id="footer-mount"></div>
<script src="js/app.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
