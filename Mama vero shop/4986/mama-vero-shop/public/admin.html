<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Mama Vero Shop</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="navbar-mount"></div>

<section class="section container">
  <h1 class="section-title">Admin Dashboard</h1>
  <p class="section-subtitle">Manage products, inventory, orders, and payments.</p>

  <div class="admin-tabs">
    <button class="admin-tab active" data-tab="overview">Overview</button>
    <button class="admin-tab" data-tab="products">Products</button>
    <button class="admin-tab" data-tab="orders">Orders</button>
    <button class="admin-tab" data-tab="customers">Customers</button>
  </div>

  <div class="admin-panel active" id="panel-overview">
    <div class="overview-grid" id="overview-grid"></div>
  </div>

  <div class="admin-panel" id="panel-products">
    <div class="toolbar">
      <input id="product-search" class="form-control" style="max-width:240px;" placeholder="Search products...">
      <button class="btn btn-primary" id="add-product-btn">+ Add Product</button>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="products-tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="admin-panel" id="panel-orders">
    <div class="toolbar">
      <select id="order-payment-filter" class="form-control" style="max-width:200px;">
        <option value="">All Payment Statuses</option>
        <option value="pending">Pending</option>
        <option value="verified">Verified</option>
        <option value="rejected">Rejected</option>
      </select>
      <select id="order-status-filter" class="form-control" style="max-width:200px;">
        <option value="">All Order Statuses</option>
        <option value="pending">Pending</option>
        <option value="preparing">Preparing</option>
        <option value="ready_for_pickup">Ready for Pickup</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>Order #</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
        <tbody id="orders-tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="admin-panel" id="panel-customers">
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th></tr></thead>
        <tbody id="customers-tbody"></tbody>
      </table>
    </div>
  </div>
</section>

<div id="modal-mount"></div>
<div id="footer-mount"></div>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
