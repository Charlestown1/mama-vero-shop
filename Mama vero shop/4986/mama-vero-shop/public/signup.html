<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Mama Vero Shop</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div id="navbar-mount"></div>

<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Create Your Account</h1>
    <p class="subtitle">Join Mama Vero Shop to start ordering.</p>

    <a href="/api/auth/google" class="btn btn-google btn-block mb-2">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.4 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.4 6.1 29.5 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.4l-6.3-5.3C29.4 35 26.8 36 24 36c-5.3 0-9.8-3.4-11.4-8.1l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.7l6.3 5.3C41 35.9 44 30.4 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Continue with Google
    </a>
    <div class="auth-divider">or sign up with email</div>

    <form id="signup-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" class="form-control" name="name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" name="email" required>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" class="form-control" name="phone">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" name="password" required minlength="8">
        <div class="form-hint">At least 8 characters.</div>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" class="form-control" name="confirmPassword" required minlength="8">
      </div>
      <div class="form-error" id="form-error"></div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create Account</button>
    </form>

    <p class="auth-footer-link">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
